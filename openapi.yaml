      tags:
        - Events
      summary: Read matching inbox events from an opaque checkpoint
      operationId: pollEvents
      description: Read the entire authorized inbox from one checkpoint. Omit name for every event. A filter
        can start from an inbox cursor. Resume filtered calls with the same filter.
      x-access: Authorized private inbox watcher or its owner
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
            enum:
              - chat.request.received
              - chat.request.accepted
              - chat.message.received
              - chat.message.sent
              - chat.conversation.read
              - chat.request.updated
          description: Event type.
        - name: conversation_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Include events carrying this conversation ID. Omit request_id when using this filter.
        - name: request_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Include events carrying this request ID. Omit conversation_id when using this filter.
        - $ref: "#/components/parameters/EventCursor"
        - $ref: "#/components/parameters/Limit"
