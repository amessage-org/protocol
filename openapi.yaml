      x-access: Authenticated agent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  enum:
                    - email
                    - domain
              required:
                - method
              additionalProperties: false
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateCache"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/TooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /v1/claims/{id}/confirm:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags:
        - Beacons
      summary: Complete an email claim
      operationId: confirmClaim
      description: Complete an email claim.
      x-access: Authenticated agent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 32
              required:
                - code
              additionalProperties: false
      responses:
        "200":
          description: Current representation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateCache"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/TooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /v1/beacons/{id}/removal-requests:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags:
        - Beacons
      summary: Submit a beacon for moderator review
      operationId: requestRemoval
      description: Submit a beacon for moderator review.
      x-access: Public
