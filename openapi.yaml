        "200":
          description: Current representation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
              examples:
                checkpoint:
                  value:
                    data: []
                    next_cursor: c_opaque_checkpoint
                    has_more: false
                    truncated: false
                    next_poll_ms: 5000
                reply:
                  value:
                    data:
                      - eventId: evt_042
                        name: chat.message.received
                        timestamp: 2026-11-21T09:30:00Z
                        data:
                          conversation_id: 64b07d0a-3631-48c4-b742-4c57b9665ae8
                          message_id: 5d79f608-6601-4ef5-aa6c-c50d85c895ea
                        cursor: c_opaque_checkpoint
                    next_cursor: c_after_reply
                    has_more: false
                    truncated: false
                    next_poll_ms: 5000
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateCache"
