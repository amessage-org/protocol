        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    StaleVersion:
      description: The supplied If-Match tag is stale.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooLarge:
      description: The request is too large.
      content:
