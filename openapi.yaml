          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: The webhook callback could not be verified.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequired:
      description: Supply the required If-Match tag.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: The caller has reached its rate limit.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: The requested delivery service or dependency is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Error:
      description: Other error. Use the stable code and trace_id.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
webhooks:
  inboxEvent:
    post:
      operationId: receiveInboxWebhook
      summary: Receive an event or a control at the subscriber’s HTTPS endpoint
      description: Outbound from aMessage. Check timestamp freshness and verify HMAC-SHA256 over the
        webhook-id, a period, webhook-timestamp, a period and the raw request body, using the base64-decoded
        secret after whsec_. Echo a verified challenge. For other deliveries, atomically record the stable
        webhook-id and payload before acknowledging. Acknowledge duplicate IDs without repeating their
        actions. The event cursor precedes the delivered event. On a gap, reconcile the inbox and poll with
        the same filter from the gap cursor for subsequent retained events.
      security: []
      parameters:
        - name: webhook-id
          in: header
          required: true
          description: Stable across retries.
          schema:
            type: string
            minLength: 1
        - name: webhook-timestamp
          in: header
          required: true
          description: Unix seconds for this delivery attempt.
          schema:
            type: string
            minLength: 1
        - name: webhook-signature
          in: header
          required: true
          description: Space-separated Standard Webhooks v1 signatures.
          schema:
            type: string
            minLength: 1
        - name: X-MCP-Subscription-Id
          in: header
          required: true
          description: Identifies the subscription.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/Event"
                - $ref: "#/components/schemas/WebhookVerification"
                - $ref: "#/components/schemas/WebhookGap"
                - $ref: "#/components/schemas/WebhookTermination"
            examples:
              reply:
                value:
                  eventId: evt_042
                  name: chat.message.received
                  timestamp: 2026-11-21T09:30:00Z
                  data:
                    conversation_id: 64b07d0a-3631-48c4-b742-4c57b9665ae8
                    message_id: 5d79f608-6601-4ef5-aa6c-c50d85c895ea
                  cursor: c_opaque_checkpoint
              verification:
                value:
                  type: verification
                  challenge: example-nonce
      responses:
        "200":
          description: For verification, echo the signed challenge in JSON. An event acknowledgment may have an
            empty body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookChallengeResponse"
              examples:
                echo:
                  value:
                    challenge: example-nonce
        "204":
          description: Event or control durably received.
        "410":
          description: Endpoint permanently gone. Stop this subscription.
        "413":
          description: Skip an oversized event and send a gap. A 413 response to that gap suspends the lease.
        "429":
          description: Receiver temporarily rate limited.
        5XX:
          description: Temporary receiver failure. Retry with backoff.
