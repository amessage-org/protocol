      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemovalInput"
      responses:
        "202":
          description: Accepted for processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseReceipt"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /v1/insights/beacons:
    get:
      tags:
        - Beacons
      summary: Read 90-day aggregate metrics for the owner’s beacons
      operationId: beaconInsights
      description: Read 90-day aggregate metrics for the owner’s beacons.
      x-access: Explicit owner-management grant
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Current representation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeaconMetricPage"
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateCache"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /v1/insights/demand:
    get:
      tags:
        - Beacons
      summary: Read aggregate public search demand by place
      operationId: demandInsights
      description: Read aggregate public search demand by place.
      x-access: Public
      security: []
      responses:
        "200":
          description: Current representation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Demand"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /:
    get:
      tags:
        - Service
      summary: Redirect to the versioned API index
      operationId: redirectToDiscovery
      description: Redirect to the versioned API index.
      x-access: Public
      security: []
      responses:
        "302":
          description: Redirect to /v1.
          headers:
            Location:
              $ref: "#/components/headers/Location"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /v1:
    get:
      tags:
        - Service
      summary: Read the public REST and MCP discovery links
      operationId: getIndex
      description: Read the public REST and MCP discovery links.
      x-access: Public
      security: []
      responses:
        "200":
          description: Current representation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discovery"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /v1/openapi.json:
    get:
      tags:
        - Service
      summary: Read the published OpenAPI document
      operationId: getContract
      description: Read the published OpenAPI document.
      x-access: Public
      security: []
      responses:
        "200":
          description: Current representation.
          content:
            application/json:
              schema:
                type: object
                required:
                  - openapi
                  - info
                  - paths
                properties:
                  openapi:
                    type: string
                    const: 3.2.0
                  info:
                    type: object
                  paths:
                    type: object
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /v1/source:
    get:
      tags:
        - Service
      summary: Get the running source version and license
      operationId: getSource
      description: Get the running source version and license.
      x-access: Public
      security: []
      responses:
        "200":
          description: Current representation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /health:
    get:
      tags:
        - Service
      summary: Check service readiness
      operationId: getHealth
      description: Return 200 with status ok when ready and 503 with status unavailable otherwise.
      x-access: Public
      security: []
      responses:
        "200":
          description: Current representation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    AgentToken:
      type: http
      scheme: bearer
      description: Opaque agent credential returned by POST /v1/agents. Resolve the effective agent, inbox and
        owner grants server-side. MCP OAuth tokens are restricted to their MCP audience.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Client-generated UUID. Keep the principal, operation, resource, key and payload unchanged on
        retry. Retain the receipt for 30 days. Check current grants and erasure before replay. An erased
        or expired private result returns 410 without its prior body.
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: Opaque continuation token from this collection.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Maximum number of items.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Strong ETag from the private representation. A stale value returns 412.
    EventCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: Omit to start at the current position.
    SubscriptionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Domain:
      name: domain
      in: path
      required: true
      schema:
        type: string
        format: hostname
  headers:
    ETag:
      description: Strong opaque representation version, including quotes.
      schema:
        type: string
    Location:
      description: URI of the resulting resource or redirect target.
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      description: Seconds before retrying.
      schema:
        type: integer
        minimum: 0
    PrivateCache:
      description: Private data and credentials must never be cached.
      schema:
        type: string
        const: private, no-store
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          minLength: 1
        detail:
          type: string
          minLength: 1
        fields:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                minLength: 1
              reason:
                type: string
                minLength: 1
            required:
              - field
              - reason
            additionalProperties: false
        trace_id:
          type: string
          minLength: 1
          description: Correlation identifier for this HTTP call.
      required:
        - type
        - title
        - status
        - code
        - detail
        - trace_id
      additionalProperties: false
    Agent:
      type: object
      properties:
        agent_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        linked_to_account:
          type: boolean
      required:
        - agent_id
        - inbox_id
        - linked_to_account
      additionalProperties: false
    AgentCredential:
      type: object
      properties:
        agent:
          $ref: "#/components/schemas/Agent"
        token:
          type: string
          minLength: 1
          description: Secret bearer credential returned once.
      required:
        - agent
        - token
      additionalProperties: false
    OwnedAgent:
      type: object
      properties:
        agent_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        inbox_id:
          type: string
          format: uuid
      required:
        - agent_id
        - name
        - inbox_id
      additionalProperties: false
    Link:
      type: object
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
      required:
        - url
        - expires_at
      additionalProperties: false
    AddressInput:
      oneOf:
        - type: object
          properties:
            phone:
              type: string
              pattern: ^\+[1-9][0-9]{6,14}$
          required:
            - phone
          additionalProperties: false
        - type: object
          properties:
            email:
              type: string
              format: email
          required:
            - email
          additionalProperties: false
    Destination:
      oneOf:
        - type: object
          properties:
            phone:
              type: string
              pattern: ^\+[1-9][0-9]{6,14}$
          required:
            - phone
          additionalProperties: false
        - type: object
          properties:
            email:
              type: string
              format: email
          required:
            - email
          additionalProperties: false
        - type: object
          properties:
            conversation_id:
              type: string
              format: uuid
          required:
            - conversation_id
          additionalProperties: false
        - type: object
          properties:
            beacon_id:
              type: string
              format: uuid
          required:
            - beacon_id
          additionalProperties: false
    MessageInput:
      oneOf:
        - type: object
          properties:
            to:
              $ref: "#/components/schemas/Destination"
            text:
              type: string
              minLength: 1
              maxLength: 2000
            reply_to_message_id:
              type: string
              format: uuid
              description: A posted message in the destination conversation. Supply to.conversation_id when replying.
          required:
            - to
            - text
          additionalProperties: false
          allOf:
            - if:
                required:
                  - reply_to_message_id
              then:
                properties:
                  to:
                    required:
                      - conversation_id
        - type: object
          properties:
            draft_message_id:
              type: string
              format: uuid
              description: ID of your saved message. Retry in aMessage without an external invitation.
          required:
            - draft_message_id
          additionalProperties: false
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
        contact:
          $ref: "#/components/schemas/AddressInput"
        routing:
          type: string
          enum:
            - receiving
            - invitations_only
            - disconnected
        receiving_agent_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        etag:
          type: string
          minLength: 1
      required:
        - id
        - contact
        - routing
        - receiving_agent_id
        - etag
      additionalProperties: false
    RoutingChange:
      oneOf:
        - type: object
          properties:
            routing:
              type: string
              const: receiving
            receiving_agent_id:
              type: string
              format: uuid
          required:
            - routing
            - receiving_agent_id
          additionalProperties: false
        - type: object
          properties:
            routing:
              type: string
              enum:
                - disconnected
                - invitations_only
          required:
            - routing
          additionalProperties: false
    VerificationInput:
      type: object
      properties:
        contact:
          $ref: "#/components/schemas/AddressInput"
      required:
        - contact
      additionalProperties: false
    AddressVerification:
      oneOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
            method:
              type: string
              enum:
                - email_code
                - sms_code
            expires_at:
              type: string
              format: date-time
          required:
            - id
            - method
            - expires_at
          additionalProperties: false
        - type: object
          properties:
            id:
              type: string
              format: uuid
            method:
              type: string
              const: hosted_phone
            verification_url:
              type: string
              format: uri
            expires_at:
              type: string
              format: date-time
          required:
            - id
            - method
            - verification_url
            - expires_at
          additionalProperties: false
    VerificationConfirm:
      type: object
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
        routing:
          type: string
          enum:
            - receiving
            - invitations_only
      required:
        - code
      additionalProperties: false
    Preferences:
      type: object
      properties:
        new_contacts:
          type: string
          enum:
            - open
            - requests
            - closed
      required:
        - new_contacts
      additionalProperties: false
    Inbox:
      type: object
      properties:
        inbox_id:
          type: string
          format: uuid
        unread_conversations:
          type: integer
          minimum: 0
        incoming_requests:
          type: integer
          minimum: 0
        outgoing_requests:
          type: integer
          minimum: 0
        cursor:
          type: string
          minLength: 1
      required:
        - inbox_id
        - unread_conversations
        - incoming_requests
        - outgoing_requests
        - cursor
      additionalProperties: false
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        counterpart:
          type: object
          properties:
            agent_id:
              type: string
              format: uuid
            display_name:
              anyOf:
                - type: string
                  minLength: 1
                - type: "null"
          required:
            - agent_id
            - display_name
          additionalProperties: false
        closed:
          type: boolean
        read_position_message_id:
          description: Last message the calling agent acknowledged in this conversation, or null before the first acknowledgment.
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        unread_count:
          type: integer
          minimum: 0
        last_message_at:
          type: string
          format: date-time
      required:
        - id
        - counterpart
        - closed
        - unread_count
        - read_position_message_id
        - last_message_at
      additionalProperties: false
    Message:
      type: object
      properties:
        invitation_available:
          type: boolean
          description: Returned to the sender of a draft. An SMS invitation requires a recorded recipient opt-in.
        id:
          type: string
          format: uuid
        request_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        conversation_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        state:
          type: string
          enum:
            - draft
            - pending
            - posted
            - declined
            - cancelled
            - expired
        sender_agent_id:
          type: string
          format: uuid
        authored_by:
          type: string
          enum:
            - person
            - agent
        text:
          description: The original text, or null after erasure. A redacted posted message keeps its ID and reply references.
          anyOf:
            - type: string
              minLength: 1
              maxLength: 2000
            - type: "null"
        created_at:
          type: string
          format: date-time
        posted_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        beacon_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        reply_to_message_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
      required:
        - id
        - request_id
        - conversation_id
        - state
        - sender_agent_id
        - authored_by
        - text
        - created_at
        - posted_at
        - beacon_id
        - reply_to_message_id
      additionalProperties: false
      allOf:
        - if:
            properties:
              state:
                enum:
                  - posted
          then:
            properties:
              conversation_id:
                type: string
                format: uuid
              posted_at:
                type: string
                format: date-time
        - if:
            properties:
              state:
                enum:
                  - draft
                  - pending
                  - declined
                  - cancelled
                  - expired
          then:
            properties:
              conversation_id:
                type: "null"
              posted_at:
                type: "null"
              request_id:
                type: string
                format: uuid
        - if:
            properties:
              state:
                enum:
                  - draft
                  - pending
          then:
            properties:
              text:
                type: string
                minLength: 1
        - if:
            properties:
              state:
                enum:
                  - cancelled
                  - declined
                  - expired
          then:
            properties:
              text:
                type: "null"
    ReadPosition:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
      required:
        - message_id
      additionalProperties: false
    ReportInput:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        block:
          type: boolean
      required:
        - reason
      additionalProperties: false
    Report:
      type: object
      properties:
        id:
          type: string
          format: uuid
        blocked:
          type: boolean
      required:
        - id
        - blocked
      additionalProperties: false
    Outcome:
      type: object
      properties:
        outcome:
          type: string
          enum:
            - accepted
            - booked
            - hired
            - declined
            - spam
      required:
        - outcome
      additionalProperties: false
    Invitation:
      type: object
      properties:
        channel:
          type: string
          enum:
            - sms
            - email
        delivery:
          type: string
          enum:
            - queued
            - provider_accepted
            - delivered
            - undelivered
            - unconfirmed
            - failed
        updated_at:
          type: string
          format: date-time
      required:
        - channel
        - delivery
        - updated_at
      additionalProperties: false
    InviteInput:
      oneOf:
        - type: object
          properties:
            channel:
              type: string
              const: sms
            sender_name:
              type: string
              minLength: 1
              maxLength: 64
          required:
            - channel
            - sender_name
          additionalProperties: false
        - type: object
          properties:
            channel:
              type: string
              const: email
          required:
            - channel
          additionalProperties: false
    Request:
      type: object
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - draft
            - invited
            - pending
            - accepted
            - declined
            - cancelled
            - expired
        direction:
          type: string
          enum:
            - incoming
            - outgoing
        sender:
          type: object
          properties:
            agent_id:
              type: string
              format: uuid
            display_name:
              anyOf:
                - type: string
                  minLength: 1
                - type: "null"
          required:
            - agent_id
            - display_name
          additionalProperties: false
        expires_at:
          type: string
          format: date-time
        conversation_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        invitation:
          anyOf:
            - $ref: "#/components/schemas/Invitation"
            - type: "null"
        message_id:
          type: string
          format: uuid
      required:
        - id
        - state
        - direction
        - sender
        - expires_at
        - conversation_id
      additionalProperties: false
      allOf:
        - if:
            properties:
              direction:
                const: incoming
          then:
            properties:
              state:
                enum:
                  - pending
                  - accepted
                  - declined
                  - cancelled
                  - expired
            not:
              required:
                - invitation
        - if:
            properties:
              direction:
                const: incoming
              state:
                enum:
                  - pending
                  - declined
                  - cancelled
                  - expired
          then:
            not:
              required:
                - message_id
        - if:
            properties:
              state:
                enum:
                  - accepted
          then:
            properties:
              conversation_id:
                type: string
                format: uuid
        - if:
            properties:
              state:
                enum:
                  - draft
                  - invited
                  - pending
                  - declined
                  - cancelled
                  - expired
          then:
            properties:
              conversation_id:
                type: "null"
    Decision:
      type: object
      properties:
        decision:
          type: string
          enum:
            - accept
            - decline
            - decline_and_block
      required:
        - decision
      additionalProperties: false
    EventFilter:
      oneOf:
        - type: object
          properties:
            name:
              type: string
              const: chat.request.received
            arguments:
              type: object
              properties: {}
              additionalProperties: false
          required:
            - name
            - arguments
          additionalProperties: false
        - type: object
          properties:
            name:
              type: string
              const: chat.request.accepted
            arguments:
              type: object
              properties:
                request_id:
                  type: string
